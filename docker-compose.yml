
services:
  backend:
    build:
      context: ./backend
    container_name: gatepass-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
    container_name: gatepass-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend